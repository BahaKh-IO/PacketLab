# Cloudflare Workers configuration of the PacketLab backend (see docs/backend.md).
name = "packetlab-api"
main = "server/worker.js"
compatibility_date = "2025-09-01"

[vars]
# Only this site may call the API from a browser (CORS).
ALLOWED_ORIGINS = "https://bahakh-io.github.io"

[[d1_databases]]
binding = "DB"
database_name = "packetlab"
# Printed by:  npx wrangler d1 create packetlab   (region WEUR, Nov 8, 2026)
database_id = "bc68fec4-99cf-44eb-a685-5625ac743e4a"
