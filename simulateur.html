<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulateur — PacketLab</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">Packet<span>Lab</span></a>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="./index.html">Accueil</a></li>
        <li><a href="./simulateur.html" aria-current="page">Simulateur</a></li>
        <li><a href="./fiabilite.html">Labo fiabilité</a></li>
        <li><a href="./quiz.html">Quiz</a></li>
        <li><a href="./fiches.html">Fiches</a></li>
        <li><a href="./cours.html">Cours</a></li>
        <li><a href="./progression.html">Progression</a></li>
      </ul>
    </nav>
  </header>

  <main class="page sim">
    <h1>Voyage d'un paquet</h1>

    <form class="sim-setup" id="setup">
      <label>Topologie <select id="topo"></select></label>
      <label>Source <select id="src"></select></label>
      <label>Destination <select id="dst"></select></label>
      <button type="submit" class="primary" id="run">Lancer</button>
    </form>
    <p class="intro" id="topo-desc"></p>
    <p class="error" id="error" hidden></p>

    <div class="sim-layout">
      <section class="sim-stage" aria-label="Topologie et contrôles">
        <div class="svg-wrap">
          <svg id="topology" class="topology" role="img" aria-label="Schéma de la topologie choisie"></svg>
        </div>
        <div class="coach" id="coach" role="dialog" aria-live="polite" aria-label="Aide et questions" hidden></div>
        <p class="caption" id="caption" aria-live="polite"></p>

        <div class="player" id="player">
          <button type="button" data-action="prev" aria-label="Étape précédente" title="Étape précédente (←)"><span class="icon" aria-hidden="true">◀</span><span class="label"> Précédent</span></button>
          <button type="button" data-action="play" class="primary" title="Lecture / pause (Espace)"><span class="icon" aria-hidden="true">▶</span><span class="label"> Lecture</span></button>
          <button type="button" data-action="next" aria-label="Étape suivante" title="Étape suivante (→)"><span class="label">Suivant </span><span class="icon" aria-hidden="true">▶</span></button>
          <button type="button" data-action="replay" aria-label="Rejouer depuis le début" title="Rejouer (R)"><span class="icon" aria-hidden="true">↺</span><span class="label"> Rejouer</span></button>
          <label class="speed"><span class="label">Vitesse</span>
            <select data-role="speed" aria-label="Vitesse">
              <option value="0.5">0,5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <span class="counter" data-role="counter" aria-live="polite"></span>
          <span class="sim-time" id="sim-time"></span>
        </div>
        <p class="keys">Clavier : ← → étape par étape · Espace lecture/pause · R rejouer</p>
        <p class="legend">
          <span class="dot dot-arp"></span> trame ARP
          <span class="dot dot-data"></span> trame de données
          <span class="dot dot-active"></span> équipement / lien actif
          · <button type="button" class="link-button" id="reset-bubbles">Réafficher les bulles d'aide</button>
        </p>
      </section>

      <aside class="sim-panels" id="panels" data-tab="headers">
        <div class="tabs" role="tablist" aria-label="Panneaux">
          <button type="button" role="tab" data-tab="headers" aria-selected="true">En-têtes</button>
          <button type="button" role="tab" data-tab="tables" aria-selected="false">Tables</button>
          <button type="button" role="tab" data-tab="log" aria-selected="false">Journal</button>
        </div>
        <section class="panel" data-panel="headers">
          <h2>En-têtes</h2>
          <div id="headers"></div>
        </section>
        <section class="panel" data-panel="tables">
          <h2>Table consultée</h2>
          <div id="tables"></div>
        </section>
        <section class="panel" data-panel="log">
          <h2>Journal</h2>
          <ol class="log" id="log"></ol>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="./js/ui/simulator-page.js"></script>
</body>
</html>
